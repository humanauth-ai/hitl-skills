name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  skill-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: plugin folder holds text files only (directory policy for non-Verified publishers)
        run: |
          set -e
          bad=0
          while IFS= read -r f; do
            case "$f" in *.sh|*.ts|*.js|*.mjs|*.cjs|*.py|*.rb|*.go|*.swift) echo "script in plugin: $f"; bad=1;; esac
            if head -c2 "$f" | grep -q '#!'; then echo "shebang in plugin: $f"; bad=1; fi
          done < <(git ls-files)
          test $bad -eq 0
      - name: every skill has frontmatter name matching its folder
        run: |
          set -e
          for d in skills/*/; do
            n=$(basename "$d")
            grep -q "^name: $n$" "$d/SKILL.md" || { echo "name mismatch in $d"; exit 1; }
            grep -q "^description: " "$d/SKILL.md" || { echo "no description in $d"; exit 1; }
          done
          test -f .claude-plugin/plugin.json && test -f .claude-plugin/marketplace.json
